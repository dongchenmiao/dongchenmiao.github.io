#entry-hint,#language-toggle,#home-back,#home-external{font:600 14px/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#entry-hint{position:fixed;left:22px;bottom:22px;z-index:20;display:flex;align-items:center;gap:12px;padding:11px 17px 11px 11px;border:1px solid rgba(170,229,216,.52);border-radius:16px;background:rgba(11,32,45,.82);color:#eff8ee;box-shadow:0 10px 32px #06111c88;backdrop-filter:blur(14px);cursor:pointer;transition:opacity .35s,transform .35s,border-color .2s}

#entry-hint .entry-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#c5e9dc;color:#163744;box-shadow:0 0 17px #86e9cf99}#entry-hint .entry-icon svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#lab-loading{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 45%,#21485a 0,#0c2535 38%,#071728 82%);color:#edf8f2;font:500 14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;transition:opacity .45s ease,visibility .45s ease}

.lab-loading-panel{position:relative;width:min(390px,100%);padding:34px;border:1px solid #aedfd044;border-radius:22px;background:#0b2838df;box-shadow:0 28px 90px #020a14aa,0 0 80px #81d8c123;backdrop-filter:blur(18px)}

.lab-loading-track{height:6px;overflow:hidden;border-radius:100px;background:#739e9b3d}
#lab-loading-fill{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7ed8c6,#c6f7cf);box-shadow:0 0 14px #9ceac4;transition:width .16s linear}

.lab-loading-footer a:hover{color:#fff;border-color:#fff}
#lab-loading-retry{padding:8px 12px;border:1px solid #a9d6c28a;border-radius:9px;background:#204959;color:#effbf4;font:700 12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;cursor:pointer}

@keyframes lab-loading-sweep{from{transform:translateX(-110%)}to{transform:translateX(290%)}}
@media(max-width:650px){.lab-loading-panel{padding:28px}.lab-loading-mark{margin-bottom:23px}}
@media(prefers-reduced-motion:reduce){#lab-loading{transition:none}#lab-loading-fill{transition:none}#lab-loading.is-indeterminate #lab-loading-fill{animation:none;width:55%!important}}
